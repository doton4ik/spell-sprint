[build]
  command = "pnpm build"
  publish = "dist"
  # Skip the build (and its credits) when nothing that ends up on the site changed:
  # research notes, SQL files, scripts, CI settings. Exit code 0 = "nothing to build".
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- src public index.html package.json pnpm-lock.yaml pnpm-workspace.yaml vite.config.ts tsconfig.json tsconfig.app.json tsconfig.node.json netlify.toml"

[build.environment]
  NODE_VERSION = "22"

# Security headers for every page.
# CSP: the app loads only its own files and talks only to Supabase (sign-in, sync, reports).
# 'unsafe-inline' for styles is needed for a few React style attributes; scripts stay strict.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://*.supabase.co wss://*.supabase.co; manifest-src 'self'; worker-src 'self'; frame-src 'none'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Cross-Origin-Opener-Policy = "same-origin"

# The service worker must always be fresh, so an update reaches everyone.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
